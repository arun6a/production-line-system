<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Assembly Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --bg: #f2f2f7; --blue: #007aff; --red: #ff3b30; --green: #34c759; --white: #ffffff; --sub: #8e8e93; --orange: #ff9500; }

        @media screen and (min-aspect-ratio: 1/1) {
            body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #000; color: #fff; text-align: center; }
            body::after { content: "PORTRAIT MODE REQUIRED"; font-weight: bold; }
            #main-container { display: none; }
        }

        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #1c1c1e; overflow-x: hidden; height: 100%; }
        
        /* Camera 50% Height */
        #reader { width: 100%; background: #000; overflow: hidden; height: 50vh !important; position: relative; }
        
        .scanner-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .scanner-cutout { position: relative; width: 85%; height: 75%; box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.5); border-radius: 8px; }
        .scanner-cutout::before, .scanner-cutout::after, .scanner-corner-bl::before, .scanner-corner-bl::after { content: ""; position: absolute; width: 40px; height: 40px; border: 6px solid white; }
        .scanner-cutout::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .scanner-cutout::after { top: 0; right: 0; border-left: none; border-bottom: none; }
        .scanner-corner-bl { position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; }
        .scanner-corner-bl::before { bottom: 0; left: 0; border-right: none; border-top: none; }
        .scanner-corner-bl::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        .container { padding: 15px; height: 50vh; overflow-y: auto; }
        .input-card { background: var(--white); padding: 20px; border-radius: 28px; border: 1px solid #e5e5ea; box-shadow: 0 12px 30px rgba(0,0,0,0.05); position: relative; z-index: 100; }
        
        .sync-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sync-info { font-size: 9px; font-weight: 800; color: var(--sub); text-transform: uppercase; }
        .sync-actions { display: flex; gap: 6px; align-items: center; }
        .btn-sync { background: var(--bg); border: none; padding: 8px 12px; border-radius: 10px; font-size: 10px; font-weight: 800; color: var(--blue); cursor: pointer; }
        .btn-hist { background: var(--bg); border: none; padding: 8px 12px; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .pending-tag { background: var(--orange); color: white; padding: 2px 6px; border-radius: 5px; margin-left: 5px; display: none; font-size:9px; }

        .flash-btn { 
            width: 34px; height: 34px; border-radius: 50%; border: 1px solid #e5e5ea; 
            background: var(--bg); font-size: 16px; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; transition: all 0.2s; color: #555;
        }
        .flash-btn.active { background: #ffcc00; border-color: #ffcc00; color: #000; }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 9px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 8px; margin-left: 4px; }
        .input-group input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #e5e5ea; font-size: 16px; box-sizing: border-box; outline: none; background: #f9f9fb; }
        
        /* Machine Buttons */
        .machine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .machine-btn {
            padding: 12px 5px; border-radius: 12px; border: 2px solid #e5e5ea; background: var(--white);
            font-size: 12px; font-weight: 700; color: var(--text); cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        /* Highlight Style (Auto-detected) */
        .machine-btn.highlight { border-color: var(--green); background: #f0fff4; color: var(--green); transform: scale(1.05); }
        /* Active Style (Manually selected) */
        .machine-btn.active { border-color: var(--blue); background: #e5f3ff; color: var(--blue); }

        .btn-submit { width: 100%; background: var(--green); color: white; border: none; padding: 20px; border-radius: 20px; font-size: 16px; font-weight: 800; margin-top: 10px; cursor: pointer; }
        .btn-submit:disabled { background: #aeaeb2; opacity: 0.6; }
        .btn-submit.offline { background: #8e8e93; }

        /* History Modal (Full Screen Popup) */
        .history-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 1000;
            transform: translateY(100%); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .history-modal.open { transform: translateY(0); }

        .modal-header { background: var(--white); padding: 15px 20px; border-bottom: 1px solid #e5e5ea; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { font-size: 24px; color: var(--blue); background: none; border: none; cursor: pointer; font-weight: 300; }

        .modal-content { flex: 1; overflow-y: auto; padding: 20px; }

        .goal-card { background: var(--white); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #e5e5ea; }
        .goal-title { font-size: 10px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 8px; }
        .goal-bar-bg { width: 100%; height: 8px; background: #e5e5ea; border-radius: 4px; overflow: hidden; }
        .goal-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--blue)); border-radius: 4px; transition: width 0.5s; }
        .goal-text { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--text); display: flex; justify-content: space-between; }

        .history-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f2f2f7; font-size: 13px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="reader">
            <div class="scanner-overlay"><div class="scanner-cutout"><div class="scanner-corner-bl"></div></div></div>
        </div>

        <div class="container">
            <div class="input-card">
                <div class="sync-bar">
                    <div class="sync-info">Sync: <span id="sync-time">...</span> <span id="pending-count" class="pending-tag">0 PENDING</span></div>
                    <div class="sync-actions">
                        <button id="flash-btn" class="flash-btn" onclick="toggleFlash()">🔦</button>
                        <button class="btn-sync" id="sync-btn" onclick="runSync()">🔄</button>
                        <button class="btn-hist" onclick="toggleHistory()">📜</button>
                    </div>
                </div>

                <div id="dup-warn" style="display:none; color:var(--red); text-align:center; font-weight:bold; font-size:11px; margin-bottom:10px;">⚠️ DUPLICATE SERIAL</div>

                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="field-date">
                </div>

                <div class="input-group">
                    <label>Serial Number</label>
                    <input type="text" id="field-serial" placeholder="Scan or Type" oninput="handleSerialInput()">
                </div>

                <div class="input-group">
                    <label>Machine Type</label>
                    <!-- Machine buttons will be DYNAMICALLY POPULATED by populateMachineGrid()
                         The hardcoded buttons below serve as FALLBACK if fetchMachines() fails -->
                    <div class="machine-grid" id="machine-buttons">
                        <button class="machine-btn" onclick="selectMachine('CIDM')">CIDM</button>
                        <button class="machine-btn" onclick="selectMachine('CSEM')">CSEM</button>
                        <button class="machine-btn" onclick="selectMachine('CSIM')">CSIM</button>
                        <button class="machine-btn" onclick="selectMachine('CCBM')">CCBM</button>
                        <button class="machine-btn" onclick="selectMachine('CIDM110')">CIDM110</button>
                        <button class="machine-btn" onclick="selectMachine('')">Clear</button>
                    </div>
                    <input type="hidden" id="field-type" value="">
                </div>
                
                <button class="btn-submit" id="submit-btn" onclick="submitScan()" disabled>SUBMIT ASSEMBLY</button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="history-modal">
        <div class="modal-header">
            <span class="modal-title">Assembly History</span>
            <button class="modal-close" onclick="toggleHistory()">×</button>
        </div>
        <div class="modal-content">
            <div class="goal-card">
                <div class="goal-title">Weekly Assembly Progress</div>
                <div class="goal-bar-bg"><div class="goal-bar-fill" id="goal-fill" style="width:0%"></div></div>
                <div class="goal-text">
                    <span id="goal-current">0</span>
                    <span id="goal-target">Target: 30</span>
                </div>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        // ================= CONFIG =================
        // === NEW CONSOLIDATED URL === (single URL for all actions)
        const CORE_URL = "https://script.google.com/macros/s/AKfycbxhC68ObyS_Z3swzMh0NjWgd9Qs2W3pOGu2HKjQRA5LIfXH_LHx_mEDyYFnCo-OxwNe/exec";
        const SCRIPT_URL = CORE_URL + "?action=logAssembly";  // assembly scan endpoint
        const MACHINES_URL = CORE_URL + "?action=readMachines";  // machine list endpoint
        
        // CSV URLs for client-side reverse-lookup (fetched on every sync)
        const ASSEMBLY_CSV_URL = `https://docs.google.com/spreadsheets/d/1vYAuJxLY3DXoTf_5Pbvin1zwA6L8N4pNOhy180ag4p0/export?format=csv`;
        const WIRING_CSV_URL = `https://docs.google.com/spreadsheets/d/19y16Nu7GdYPN0DdTZId2bfoBn4jSmV5ZVHXSkdDdcRY/export?format=csv`;
        // =========================================

        // === HARDCODED FALLBACK === (used only if fetchMachines fails)
        const FALLBACK_MODELS = ['CIDM', 'CSEM', 'CSIM', 'CCBM', 'CIDM110'];
        let ACTIVE_MODELS = [...FALLBACK_MODELS];

        // === DYNAMIC PREFIX MAP (replaces hardcoded SSKM/KM checks) ===
        let PREFIX_MAP = { 'SSKM': 'SS', 'KM': 'MS' }; // default fallback

        
        // Accepts ANY serial that looks like one (not just known prefixes)
        function looksLikeSerial(text) {
            if (!text) return false;
            const up = text.toString().trim().toUpperCase();
            if (up.startsWith('HTTP') || up.length < 5) return false;
            // Must be alphanumeric, contain at least one letter and one digit
            return /^[A-Z0-9]+$/.test(up) && /[A-Z]/.test(up) && /\d/.test(up);
        }

function isKnownSerial(serial) {
            if (!serial) return false;
            const upper = serial.toString().toUpperCase();
            const prefixes = Object.keys(PREFIX_MAP).sort((a, b) => b.length - a.length);
            for (const prefix of prefixes) {
                if (upper.startsWith(prefix)) return true;
            }
            return false;
        }

        function getMaterialTypeFromSerial(serial) {
            if (!serial) return null;
            const upper = serial.toString().toUpperCase();
            const prefixes = Object.keys(PREFIX_MAP).sort((a, b) => b.length - a.length);
            for (const prefix of prefixes) {
                if (upper.startsWith(prefix)) return PREFIX_MAP[prefix];
            }
            return null;
        }

        async function fetchPrefixMap(url) {
            // Load from localStorage FIRST (instant — no network delay)
            try {
                const cached = localStorage.getItem('prefix_map_cache');
                if (cached) {
                    PREFIX_MAP = JSON.parse(cached);
                    console.log('Loaded cached prefix map:', PREFIX_MAP);
                }
            } catch(e) {}

            // Fetch fresh in background (updates cache for next time)
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.prefixMap) {
                    PREFIX_MAP = data.prefixMap;
                } else if (data.machines) {
                    PREFIX_MAP = {};
                    data.machines.forEach(m => {
                        if (m.status === 'active' && m.serial_prefix) {
                            PREFIX_MAP[m.serial_prefix.toUpperCase()] = m.material_type.toUpperCase();
                        }
                    });
                    if (!PREFIX_MAP['SSKM']) PREFIX_MAP['SSKM'] = 'SS';
                    if (!PREFIX_MAP['KM']) PREFIX_MAP['KM'] = 'MS';
                }
                // Save to localStorage for next app open (instant load)
                localStorage.setItem('prefix_map_cache', JSON.stringify(PREFIX_MAP));
                console.log('Updated prefix map cache');
            } catch (err) {
                console.warn('Prefix map fetch failed, using cached/default:', err);
            }
            // Re-render with loaded prefix map
            try {
                if (typeof _prefixMapResynced === 'undefined') _prefixMapResynced = false;
                if (!_prefixMapResynced) {
                    _prefixMapResynced = true;
                    if (typeof renderHistory === 'function') renderHistory();
                    if (typeof wrRenderHistory === 'function') wrRenderHistory();
                    if (typeof fetchData === 'function') fetchData(true);
                    else if (typeof runSync === 'function') runSync();
                    console.log('Re-rendered after PREFIX_MAP loaded');
                }
            } catch(e) { console.warn('Re-render failed:', e); }
        } catch(e) { console.warn('Re-render after prefix map failed:', e); }

            console.warn('Prefix map fetch failed, using default:', err);
            }
        }

        let html5QrCode;
        let isTorchOn = false;
        const LS_HIST = 'assembly_history';
        const LS_WIRE_MAP = 'assembly_wiring_map'; 
        const LS_TIME = 'assembly_sync_time';
        let pendingQueue = JSON.parse(localStorage.getItem('assembly_pending') || "[]");
        let selectedMachine = "";

        document.addEventListener("DOMContentLoaded", async () => { 
            initDate();
            await fetchPrefixMap(MACHINES_URL);  // CRITICAL: load prefix map BEFORE parsing
            fetchMachines();  // fetch machine list for button grid
            runSync(); 
        });

        function initDate() {
            document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
        }

        // --- FETCH MACHINE LIST FROM REGISTRY ---
        async function fetchMachines() {
            try {
                const res = await fetch(MACHINES_URL);
                const data = await res.json();
                if (data.machines && data.machines.length > 0) {
                    // Extract unique model names (since each model has 2 material types: SS + MS)
                    ACTIVE_MODELS = [...new Set(data.machines.map(m => m.model_name))];
                    console.log(`Loaded ${ACTIVE_MODELS.length} models from registry:`, ACTIVE_MODELS);
                }
            } catch (err) {
                console.warn('Dynamic fetch failed, using fallback list:', err);
            }
            populateMachineGrid();
        }

        // --- BUILD MACHINE BUTTON GRID DYNAMICALLY ---
        function populateMachineGrid() {
            const grid = document.getElementById('machine-buttons');
            if (!grid) return;
            grid.innerHTML = '';
            ACTIVE_MODELS.forEach(model => {
                const btn = document.createElement('button');
                btn.className = 'machine-btn';
                btn.innerText = model;
                btn.onclick = () => selectMachine(model);
                grid.appendChild(btn);
            });
            // Add Clear button at the end
            const clearBtn = document.createElement('button');
            clearBtn.className = 'machine-btn';
            clearBtn.innerText = 'Clear';
            clearBtn.onclick = () => selectMachine('');
            grid.appendChild(clearBtn);
        }

        // --- HISTORY MODAL LOGIC ---
        function toggleHistory() {
            const modal = document.getElementById('history-modal');
            modal.classList.toggle('open');
        }

        // --- MACHINE BUTTON LOGIC ---
        function selectMachine(name) {
            selectedMachine = name;
            document.getElementById('field-type').value = name;
            
            const buttons = document.querySelectorAll('.machine-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active', 'highlight'); 
                if(btn.innerText === name) btn.classList.add('active');
            });

            checkDup();
        }

        async function toggleFlash() {
            if (!html5QrCode) return;
            const btn = document.getElementById('flash-btn');
            try {
                const cap = html5QrCode.getRunningTrackCapabilities();
                if (cap.torch) {
                    isTorchOn = !isTorchOn;
                    await html5QrCode.applyVideoConstraints({ torch: isTorchOn });
                    btn.classList.toggle('active', isTorchOn);
                    btn.innerText = isTorchOn ? "💡" : "🔦";
                }
            } catch (e) {}
        }

        // --- SYNC LOGIC ---
        async function runSync() {
            const btn = document.getElementById('sync-btn');
            btn.innerText = "...";
            
            try {
                const wRes = await fetch(WIRING_CSV_URL + '&t=' + Date.now());
                const wText = await wRes.text();
                parseAndStoreWiring(wText);

                const aRes = await fetch(ASSEMBLY_CSV_URL + '&t=' + Date.now());
                const aText = await aRes.text();
                parseAndStoreAssembly(aText);

                const time = new Date().toLocaleTimeString();
                localStorage.setItem(LS_TIME, time);
                document.getElementById('sync-time').innerText = time;
                
                updateGoal();
                renderHistory();
                updatePendingUI();
                handleSerialInput(); 

                if (!html5QrCode) startScanner();

                btn.innerText = "🔄";
            } catch (e) {
                console.error(e);
                btn.innerText = "⚠️";
                if (!html5QrCode) startScanner();
            }
        }

        // === DYNAMIC COLUMN DISCOVERY ===
        // Replaces the old hardcoded `machineCols = { "CIDM": 1, "CSEM": 2, ... }` map
        // Now reads headers from the CSV and builds the map dynamically.
        // This way, when addMachine() appends a new column, this code automatically picks it up.
        function parseAndStoreWiring(text) {
            const rows = text.split('\n');
            if (rows.length < 2) return;
            
            // Parse headers (using same CSV parsing as before)
            const rawHeaders = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/"/g, '').trim());
            
            // Junk column skip logic (preserved verbatim from old code)
            const ignoreExact = ['id', 's.no', 'sno', 'no', '#'];
            const ignoreSubstrings = ['date', 'time', 'shift', 'operator', 'status', 'remark', 
                                      'note', 'total', 'count', 'day', 'name', 'model', 
                                      'serial', 'input', 'scan'];
            
            // Build dynamic machineCols map: { col_index: model_name }
            // Only includes valid (non-junk) columns
            const machineCols = {};
            rawHeaders.forEach((h, idx) => {
                if (!h) return;
                const lh = h.toLowerCase();
                if (ignoreExact.includes(lh) || ignoreSubstrings.some(k => lh.includes(k))) return;
                machineCols[idx] = h;
            });
            
            // Build serial → model map by iterating all valid columns dynamically
            const map = {};
            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                for (const [idx, modelName] of Object.entries(machineCols)) {
                    const s = cells[idx] ? cells[idx].trim().toUpperCase() : "";
                    if (looksLikeSerial(s)) map[s] = modelName;
                }
            }
            localStorage.setItem(LS_WIRE_MAP, JSON.stringify(map));
        }

        function parseAndStoreAssembly(text) {
            const rows = text.split('\n');
            if (rows.length < 2) return;
            const history = [];
            const now = new Date();
            const cutoff = new Date(now.setDate(now.getDate() - 30));
            
            // Parse headers + build dynamic machineCols map (same logic as parseAndStoreWiring)
            const rawHeaders = rows[0].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(h => h.replace(/"/g, '').trim());
            const ignoreExact = ['id', 's.no', 'sno', 'no', '#'];
            const ignoreSubstrings = ['date', 'time', 'shift', 'operator', 'status', 'remark', 
                                      'note', 'total', 'count', 'day', 'name', 'model', 
                                      'serial', 'input', 'scan'];
            const machineCols = {};
            rawHeaders.forEach((h, idx) => {
                if (!h) return;
                const lh = h.toLowerCase();
                if (ignoreExact.includes(lh) || ignoreSubstrings.some(k => lh.includes(k))) return;
                machineCols[idx] = h;
            });

            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/"/g, '').trim());
                const dateStr = cells[0] || "";
                const dateObj = parseDate(dateStr);
                
                for (const [idx, name] of Object.entries(machineCols)) {
                    const s = cells[idx] ? cells[idx].trim().toUpperCase() : "";
                    if (looksLikeSerial(s)) {
                        if (dateObj >= cutoff) {
                            history.push({ serial: s, type: name, date: dateStr, status: 'synced' });
                        }
                    }
                }
            }
            localStorage.setItem(LS_HIST, JSON.stringify(history));
        }

        // --- SCANNER ---
        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 25, qrbox: (vw, vh) => { return { width: vw * 0.85, height: vh * 0.75 }; } }, 
                (text) => {
                    const up = text.trim().toUpperCase();
                    if (looksLikeSerial(up)) {
                        document.getElementById('field-serial').value = up;
                        handleSerialInput(); 
                        vibe(50);
                    }
                }
            ).catch(e => console.log("Camera Error", e));
        }

        // --- LOOKUP LOGIC ---
        function handleSerialInput() {
            const s = document.getElementById('field-serial').value.trim().toUpperCase();
            const buttons = document.querySelectorAll('.machine-btn');
            
            buttons.forEach(btn => btn.classList.remove('highlight', 'active'));
            if (!s) { selectedMachine = ""; checkDup(); return; }

            const map = JSON.parse(localStorage.getItem(LS_WIRE_MAP) || "{}");
            const foundMachine = map[s] || "";

            if (foundMachine) {
                selectedMachine = foundMachine;
                document.getElementById('field-type').value = foundMachine;
                buttons.forEach(btn => { if(btn.innerText === foundMachine) btn.classList.add('highlight'); });
            } else {
                selectedMachine = "";
                document.getElementById('field-type').value = "";
            }
            checkDup();
        }

        function checkDup() {
            const s = document.getElementById('field-serial').value.trim().toUpperCase();
            const warn = document.getElementById('dup-warn');
            const btn = document.getElementById('submit-btn');
            if (!s) { btn.disabled = true; warn.style.display = 'none'; return; }
            const history = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
            const isDup = history.some(x => x.serial === s) || pendingQueue.some(x => x.serial === s);
            warn.style.display = isDup ? 'block' : 'none';
            btn.disabled = isDup || !selectedMachine;
        }

        // --- SUBMIT ---
        async function submitScan() {
            const s = document.getElementById('field-serial').value.trim().toUpperCase();
            const t = selectedMachine; 
            const d = document.getElementById('field-date').value;
            const btn = document.getElementById('submit-btn');

            if (!s || !t) { alert("Serial not found in Wiring or no machine selected."); return; }

            btn.disabled = true;
            btn.innerText = "SENDING...";

            const data = { serial: s, machineType: t, date: d };

            try {
                if (!navigator.onLine) throw new Error("Offline");
                await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
                btn.innerText = "SUCCESS ✓"; btn.classList.add("success");
                
                let history = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
                history.push({ serial: s, type: t, date: d, status: 'synced' });
                localStorage.setItem(LS_HIST, JSON.stringify(history));
            } catch (e) {
                pendingQueue.push(data);
                localStorage.setItem('assembly_pending', JSON.stringify(pendingQueue));
                btn.innerText = "SAVED OFFLINE 📦"; btn.classList.add("offline");
                
                let history = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
                history.push({ serial: s, type: t, date: d, status: 'pending' });
                localStorage.setItem(LS_HIST, JSON.stringify(history));
            }

            vibe([100, 50, 100]);
            updatePendingUI(); updateGoal(); renderHistory();

            setTimeout(() => {
                document.getElementById('field-serial').value = "";
                const buttons = document.querySelectorAll('.machine-btn');
                buttons.forEach(btn => btn.classList.remove('highlight', 'active'));
                selectedMachine = "";
                btn.innerText = "SUBMIT ASSEMBLY";
                btn.classList.remove("success", "offline");
                handleSerialInput();
            }, 1500);
        }

        // --- HELPERS ---
        function parseDate(s) {
            if (!s) return new Date(0);
            const p = s.split(/[\/\-]/);
            let date;
            if (p[0].length === 4) date = new Date(p[0], p[1]-1, p[2]);
            else date = new Date(p[2], p[1]-1, p[0]);
            return date;
        }

        function updateGoal() {
            const now = new Date();
            const start = new Date(now); start.setDate(now.getDate() - now.getDay()); start.setHours(0,0,0,0);
            const end = new Date(start); end.setDate(start.getDate() + 6);
            const history = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
            let count = history.filter(i => { const d = parseDate(i.date); return d >= start && d <= end; }).length;
            const goal = 30; const pct = Math.min((count/goal)*100, 100);
            document.getElementById('goal-fill').style.width = pct + '%';
            document.getElementById('goal-current').innerText = count;
        }
        
        function renderHistory() {
            const target = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
            const list = history.slice(-50).reverse();
            target.innerHTML = list.map(i => {
                const prefix = getMaterialTypeFromSerial(i.serial) || "MS";
                const fullName = `${prefix} ${i.type}`;
                return `
                <div class="history-item">
                    <span style="font-weight:600;">
                        <span class="status-dot" style="background:${i.status==='pending'?'var(--orange)':'var(--green)'}"></span>
                        ${fullName} - ${i.serial.substring(0,12)}
                    </span>
                    <span style="color:var(--sub)">${i.date}</span>
                </div>`;
            }).join('');
        }

        function updatePendingUI() {
            const el = document.getElementById('pending-count');
            el.innerText = pendingQueue.length + " PENDING";
            el.style.display = pendingQueue.length > 0 ? 'inline-block' : 'none';
        }
        
        async function autoPush() {
            if (pendingQueue.length === 0 || !navigator.onLine) return;
            const data = pendingQueue[0];
            try {
                await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
                pendingQueue.shift(); localStorage.setItem('assembly_pending', JSON.stringify(pendingQueue)); updatePendingUI();
                let history = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
                const idx = history.findIndex(x => x.serial === data.serial && x.status === 'pending');
                if (idx !== -1) history[idx].status = 'synced';
                localStorage.setItem(LS_HIST, JSON.stringify(history));
                renderHistory(); updateGoal();
                if (pendingQueue.length > 0) autoPush();
            } catch(e) {}
        }
        setInterval(autoPush, 5000);
        function vibe(p) { if (navigator.vibrate) navigator.vibrate(p); }
    </script>
</body>
</html>
